<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102f29" />
    <meta name="application-name" content="Hola Maps" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hola Maps" />
    <!-- hola-map-preconnect -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://protomaps.github.io" crossorigin />
    <link rel="dns-prefetch" href="//unpkg.com" />
    <link rel="dns-prefetch" href="//protomaps.github.io" />
    <link rel="preload" href="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js" as="script" crossorigin="anonymous" />
    <link rel="preload" href="https://unpkg.com/@protomaps/basemaps@5/dist/basemaps.js" as="script" crossorigin="anonymous" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml" />

    <!-- Warm up map providers before React/MapLibre starts. -->
    <link rel="preconnect" href="https://api.maptiler.com" crossorigin />
    <link rel="dns-prefetch" href="//api.maptiler.com" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="//tiles.openfreemap.org" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="//tile.openstreetmap.org" />

    <title>Hola Maps - Khám phá Hòa Lạc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
