services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: hola-maps-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hola}
      POSTGRES_DB: ${POSTGRES_DB:-hola_maps}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - hola_maps_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hola} -d ${POSTGRES_DB:-hola_maps}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hola_maps_db_data:
