name: Deploy Hola Maps to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hola-maps-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, build and restart
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -se' <<'REMOTE'
            set -euo pipefail

            APP_DIR=/var/www/bandohoalac

            cd "$APP_DIR"

            echo "==> Sync source"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "==> Canonical domain check"
            DOMAIN_MARKER="$APP_DIR/.maps-domain-migrated"
            if [ ! -f "$DOMAIN_MARKER" ]; then
              if getent ahostsv4 maps.dothihoalac.vn >/dev/null 2>&1; then
                echo "DNS for maps.dothihoalac.vn resolves; attempting one-time domain migration"
                if bash scripts/migrate-production-domain-to-maps.sh; then
                  touch "$DOMAIN_MARKER"
                  echo "Canonical domain migration completed"
                else
                  echo "WARN: maps domain migration is not ready yet; keeping the existing domain for this deploy"
                fi
              else
                echo "DNS for maps.dothihoalac.vn is not ready; keeping map.dothihoalac.vn for now"
              fi
            else
              echo "Canonical maps domain migration already completed"
            fi

            echo "==> Legacy map.dothihoalac.vn 301 redirect"
            REDIRECT_MARKER="$APP_DIR/.map-domain-301-v1"
            if [ ! -f "$REDIRECT_MARKER" ]; then
              bash scripts/enforce-legacy-map-redirect.sh
              touch "$REDIRECT_MARKER"
              echo "Legacy domain now redirects permanently to maps.dothihoalac.vn"
            else
              echo "Legacy domain 301 redirect already configured"
            fi

            echo "==> Ensure image/search runtime tools"
            if command -v apt-get >/dev/null 2>&1; then
              if [ "$(id -u)" -eq 0 ]; then
                command -v cwebp >/dev/null 2>&1 || {
                  apt-get update -qq || true
                  apt-get install -y webp postgresql-contrib >/dev/null 2>&1 || true
                }
              elif command -v sudo >/dev/null 2>&1; then
                command -v cwebp >/dev/null 2>&1 || {
                  sudo apt-get update -qq || true
                  sudo apt-get install -y webp postgresql-contrib >/dev/null 2>&1 || true
                }
              fi
            fi
            command -v cwebp >/dev/null 2>&1 || echo "WARN: cwebp missing; local image variants will fall back to originals"

            echo "==> Install dependencies"
            npm ci
            npm ci --prefix backend
            npm install --prefix frontend --no-audit --no-fund

            echo "==> Apply database schema"
            npm run db:migrate

            echo "==> Backfill optimized place images"
            npm run images:backfill-variants --prefix backend -- --limit=250 || true

            echo "==> Build frontend"
            npm run build

            echo "==> Restart backend"
            pm2 restart bandohoalac-api --update-env
            pm2 save

            echo "==> Health check"
            sleep 2
            curl --fail --silent --show-error http://127.0.0.1:5003/api/health
            echo
          REMOTE
