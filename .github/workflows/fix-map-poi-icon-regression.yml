name: Fix map POI icon regression

on:
  push:
    branches:
      - fix/map-poi-icons
    paths:
      - .github/workflows/fix-map-poi-icon-regression.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch hotfix script
        run: git show origin/fix/map-poi-icons:scripts/fix-map-poi-icons.py > /tmp/fix-map-poi-icons.py

      - name: Restore stable POI icon sizing
        run: python3 /tmp/fix-map-poi-icons.py

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/MapView.jsx
          git commit -m "Fix map POI marker icons"
          git push origin HEAD:main
