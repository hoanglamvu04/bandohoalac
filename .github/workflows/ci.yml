name: Hola Maps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository safety gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate production shell scripts
        run: bash -n scripts/*.sh

      - name: Validate SEO route and sitemap contract
        run: bash scripts/check-seo-routing.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Performance V3 budget
        run: npm run perf:budget

  e2e:
    name: Frontend E2E stability
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E
        run: npm run test:e2e

  backend:
    name: Backend migrate and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hola_maps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hola_maps"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hola_maps
      JWT_SECRET: ci-test-secret
      HOLA_MAPS_HALO_SECRET: ci-halo-shared-secret
      CORS_ORIGIN: http://localhost:5175
      PUBLIC_BASE_URL: http://localhost:5003
      UPLOAD_PROVIDER: local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install image codec
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Migrate and seed
        run: npm run db:migrate:seed

      - name: Test
        run: npm test

      - name: Restore verified backup into isolated empty CI database
        env:
          BACKUP_DIR: /tmp/hola-restore-ci-backups
          RESTORE_DRILL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hola_restore_ci_check
          RESTORE_DRILL_CONFIRM: RESTORE_IN_EMPTY_HOLA_RESTORE_DB
        run: |
          mkdir -p "$BACKUP_DIR" "$RUNNER_TEMP/hola-pg16-tools"
          # The GitHub service already uses PostGIS16; use its PG16 tools in
          # a throwaway container. Runner apt may only ship newer clients.
          docker image inspect postgis/postgis:16-3.4 >/dev/null
          for tool in pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/hola-pg16-tools/$tool" <<'PG_TOOL'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="$(basename "$0")"
          exec docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$BACKUP_DIR:$BACKUP_DIR" \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            postgis/postgis:16-3.4 "$tool" "$@"
          PG_TOOL
            chmod +x "$RUNNER_TEMP/hola-pg16-tools/$tool"
          done
          export PATH="$RUNNER_TEMP/hola-pg16-tools:$PATH"
          pg_dump --version
          pg_restore --version
          npm run db:backup
          node --input-type=module -e "import pg from 'pg'; const c=new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect(); await c.query('CREATE DATABASE hola_restore_ci_check'); await c.end();"
          npm run ops:restore:drill
