name: Apply Map Discovery UI v3

on:
  push:
    branches:
      - feature/map-discovery-ui-v3
    paths:
      - .github/workflows/apply-map-discovery-ui-v3.yml
      - scripts/apply-map-discovery-ui-v3.mjs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/map-discovery-ui-v3
          fetch-depth: 0

      - name: Apply discovery UI patch
        run: node scripts/apply-map-discovery-ui-v3.mjs

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/place.service.js frontend/src/pages/MapPage.jsx frontend/src/components/MapView.jsx frontend/src/map-workspace.css
          if git diff --cached --quiet; then
            echo "No source changes produced"
            exit 0
          fi
          git commit -m "Upgrade map discovery experience"
          git push origin HEAD:feature/map-discovery-ui-v3
